<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" fill="none">
  <defs>
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181817" />
      <stop offset="100%" stop-color="#0d0d0c" />
    </linearGradient>
    <linearGradient id="emeraldPulseFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(4, 8)">
    <rect width="80" height="80" rx="20" fill="url(#bgGradFull)" />
    <rect x="0.75" y="0.75" width="78.5" height="78.5" rx="19.25" stroke="#2c2c28" stroke-width="1.2" fill="none" />

    <!-- Stylized 'a' -->
    <path
      d="M38 48 C38 58 31 63 22 63 C13 63 7 57 7 48 C7 38 15 33 26 32 L38 31 L38 27 C38 20 34 16 26 16 C19 16 14 19 11 23 L7 18 C11 12 18 10 27 10 C39 10 47 16 47 27 L47 52 C47 57 48 60 50 62 L44 63 C41 61 39 56 38 48 Z M38 38 L27 39 C19 40 15 43 15 48 C15 53 19 56 24 56 C32 56 38 50 38 41 L38 38 Z"
      fill="#ffffff"
      transform="scale(0.8) translate(3, 4)"
    />

    <!-- Acoustic / Neural Waves -->
    <rect x="52" y="36" width="3.5" height="15" rx="1.75" fill="#9ca3af" />
    <rect x="58" y="27" width="3.5" height="32" rx="1.75" fill="#ffffff" />
    <rect x="64" y="34" width="3.5" height="19" rx="1.75" fill="#9ca3af" />

    <!-- Emerald Intelligence Node -->
    <circle cx="59.75" cy="18" r="3.5" fill="url(#emeraldPulseFull)" />
  </g>

  <!-- Typography: 'aitalky' -->
  <g transform="translate(104, 48)">
    <text
      x="0"
      y="10"
      font-family="'Newsreader', Georgia, 'Times New Roman', serif"
      font-size="44"
      font-weight="900"
      letter-spacing="-1.5"
      fill="currentColor"
    >
      aitalky
    </text>

    <!-- Sub-Masthead -->
    <text
      x="2"
      y="28"
      font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="9"
      font-weight="600"
      letter-spacing="2.8"
      fill="#6b7280"
    >
      ARTIFICIAL INTELLIGENCE JOURNALISM
    </text>
  </g>
</svg>
